<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 환율 계산기</title>
  <!-- Tailwind CSS CDN 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 및 Inter 웹폰트 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // Tailwind 다크 모드 및 폰트 설정
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Inter', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* 숫자 입력창 기본 화살표(스피너) 제거 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* 부드러운 스크롤 및 기본 트랜지션 */
    body {
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* 토스트 알림 애니메이션 */
    @keyframes slideUpFade {
      0% { opacity: 0; transform: translate(-50%, 16px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -8px); }
    }
    .toast-animate {
      animation: slideUpFade 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">

  <!-- 메인 컨테이너 -->
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    
    <!-- 1. 헤더 영역 -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-sm shadow-blue-600/20">
            ₩
          </div>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
            실시간 환율 계산기
          </h1>
        </div>
        <p class="mt-1.5 text-xs sm:text-sm text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          2026년 11월 18일 서울외환시장 마감 기준
        </p>
      </div>

      <!-- 우측 컨트롤 버튼 그룹 (환율 직접 수정 토글 & 다크모드 토글) -->
      <div class="flex items-center gap-2.5 self-start sm:self-auto">
        <!-- 환율 직접 수정 토글 버튼 -->
        <button id="toggleEditRateBtn" type="button" 
          class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
          <span id="editRateBtnText">환율 직접 수정</span>
        </button>

        <!-- 다크 모드 / 라이트 모드 토글 버튼 -->
        <button id="themeToggleBtn" type="button" aria-label="테마 전환"
          class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition shadow-sm">
          <!-- 해 아이콘 (다크모드일 때 표시) -->
          <svg id="sunIcon" class="w-5 h-5 hidden text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- 달 아이콘 (라이트모드일 때 표시) -->
          <svg id="moonIcon" class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. 한국 원화 (KRW) 메인 입력 카드 -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-7 shadow-sm border border-slate-200/80 dark:border-slate-800 mb-6 transition-all">
      <div class="flex items-center justify-between mb-3">
        <label for="krwInput" class="flex items-center gap-2 text-sm sm:text-base font-semibold text-slate-700 dark:text-slate-200">
          <span class="text-xl">🇰🇷</span>
          <span>대한민국 원 (KRW)</span>
          <span id="reverseBadge" class="hidden ml-1 px-2 py-0.5 text-[11px] font-medium rounded-full bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300">
            외화 역산 중
          </span>
        </label>
        <span id="koreanUnitText" class="text-xs sm:text-sm font-medium text-blue-600 dark:text-blue-400">
          십만원
        </span>
      </div>

      <!-- 원화 입력 인풋 래퍼 -->
      <div class="relative flex items-center">
        <span class="absolute left-4 text-xl sm:text-2xl font-bold text-slate-400 dark:text-slate-500 select-none">
          ₩
        </span>
        <input 
          id="krwInput" 
          type="text" 
          inputmode="numeric"
          value="100,000" 
          placeholder="금액을 입력하세요"
          class="w-full pl-11 pr-20 py-4 text-2xl sm:text-4xl font-bold tracking-tight bg-slate-50 dark:bg-slate-950/70 border-2 border-slate-200 dark:border-slate-800 rounded-2xl focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 text-slate-900 dark:text-white transition"
        />
        <!-- 초기화 (X) 버튼 & 원 단위 표기 -->
        <div class="absolute right-3 flex items-center gap-2">
          <button id="clearInputBtn" type="button" title="입력 지우기"
            class="p-1.5 rounded-full bg-slate-200/80 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
          <span class="text-base sm:text-lg font-semibold text-slate-500 dark:text-slate-400 pr-1 select-none">
            원
          </span>
        </div>
      </div>

      <!-- 빠른 금액 추가 프리셋 버튼 그룹 -->
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button type="button" data-add="1000" class="preset-btn px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 active:scale-95 transition">
          +1천원
        </button>
        <button type="button" data-add="10000" class="preset-btn px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 active:scale-95 transition">
          +1만원
        </button>
        <button type="button" data-add="50000" class="preset-btn px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 active:scale-95 transition">
          +5만원
        </button>
        <button type="button" data-add="100000" class="preset-btn px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 active:scale-95 transition">
          +10만원
        </button>
        <button type="button" data-add="1000000" class="preset-btn px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/30 dark:hover:text-blue-400 active:scale-95 transition">
          +100만원
        </button>
        <button id="resetAllBtn" type="button" class="ml-auto px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/40 active:scale-95 transition">
          초기화
        </button>
      </div>
    </section>

    <!-- 안내 문구 및 기준 환율 초기화 배너 (환율 직접 수정 모드일 때만 표시) -->
    <div id="customRateBanner" class="hidden mb-5 px-4 py-3 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800/60 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs sm:text-sm text-blue-800 dark:text-blue-300">
      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>각 통화 카드의 <strong>기준 환율 입력칸</strong>을 수정하면 실시간으로 계산에 반영됩니다.</span>
      </div>
      <button id="restoreDefaultRatesBtn" type="button" class="self-end sm:self-auto px-3 py-1 rounded-lg bg-blue-600 text-white text-xs font-medium hover:bg-blue-700 transition">
        기본 고시환율 복원
      </button>
    </div>

    <!-- 3. 다중 통화 환산 결과 그리드 -->
    <div class="flex items-center justify-between mb-3 px-1">
      <h2 class="text-sm sm:text-base font-semibold text-slate-700 dark:text-slate-300">
        주요 통화 실시간 환산 결과
      </h2>
      <span class="text-xs text-slate-400 dark:text-slate-500">
        카드의 금액을 클릭해 외화 기준 역산 가능
      </span>
    </div>

    <section id="currencyGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4">
      <!-- JavaScript에서 통화 카드 동적 렌더링 -->
    </section>

    <!-- 푸터 안내 -->
    <footer class="mt-10 pt-6 border-t border-slate-200/70 dark:border-slate-800/70 text-center text-xs text-slate-400 dark:text-slate-500 space-y-1">
      <p>제공되는 환율 정보는 매매기준율 참고용이며, 실제 은행 및 환전소 거래 시 스프레드(수수료)가 적용될 수 있습니다.</p>
      <p>팁: 각 통화 금액 칸에 직접 숫자를 입력하면 한국 원화(KRW) 및 다른 나라 통화로도 즉시 역산됩니다.</p>
    </footer>
  </div>

  <!-- 복사 완료 토스트 메시지 -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="px-4 py-2.5 rounded-full bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs sm:text-sm font-medium shadow-lg flex items-center gap-2">
      <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
      <span id="toastMessage">복사되었습니다!</span>
    </div>
  </div>

  <!-- 애플리케이션 로직 스크립트 -->
  <script>
    /**
     * 기본 통화 데이터 정의
     * unit: 환율 고시 단위 (엔화, 베트남 동은 100단위 고시)
     * defaultRate: unit 당 원화(KRW) 가치
     * decimals: 결과 표시 소수점 자릿수
     */
    const INITIAL_CURRENCIES = [
      {
        code: 'JPY',
        name: '일본 엔',
        flag: '🇯🇵',
        symbol: '¥',
        unit: 100,
        defaultRate: 836.47,
        decimals: 0,
        featured: true // 상단 강조 배치
      },
      {
        code: 'USD',
        name: '미국 달러',
        flag: '🇺🇸',
        symbol: '$',
        unit: 1,
        defaultRate: 1333.00,
        decimals: 2,
        featured: true // 상단 강조 배치
      },
      {
        code: 'EUR',
        name: '유럽 유로',
        flag: '🇪🇺',
        symbol: '€',
        unit: 1,
        defaultRate: 1463.57,
        decimals: 2,
        featured: false
      },
      {
        code: 'CNY',
        name: '중국 위안',
        flag: '🇨🇳',
        symbol: '¥',
        unit: 1,
        defaultRate: 199.92,
        decimals: 2,
        featured: false
      },
      {
        code: 'GBP',
        name: '영국 파운드',
        flag: '🇬🇧',
        symbol: '£',
        unit: 1,
        defaultRate: 1735.00,
        decimals: 2,
        featured: false
      },
      {
        code: 'TWD',
        name: '대만 달러',
        flag: '🇹🇼',
        symbol: 'NT$',
        unit: 1,
        defaultRate: 41.50,
        decimals: 2,
        featured: false
      },
      {
        code: 'VND',
        name: '베트남 동',
        flag: '🇻🇳',
        symbol: '₫',
        unit: 100,
        defaultRate: 5.25,
        decimals: 0,
        featured: false
      },
      {
        code: 'THB',
        name: '태국 바트',
        flag: '🇹🇭',
        symbol: '฿',
        unit: 1,
        defaultRate: 38.80,
        decimals: 2,
        featured: false
      }
    ];

    // 애플리케이션 상태 관리 객체
    const state = {
      krwAmount: 100000,          // 현재 입력된 원화 금액
      activeCurrency: 'KRW',      // 현재 사용자가 타이핑 중인 통화 코드 ('KRW' 또는 외화 코드)
      isEditRateMode: false,      // 환율 직접 수정 모드 여부
      rates: {}                   // 통화별 현재 적용 환율 (unit 당 KRW)
    };

    // 초기 환율 세팅
    INITIAL_CURRENCIES.forEach(c => {
      state.rates[c.code] = c.defaultRate;
    });

    // DOM 요소 참조
    const krwInput = document.getElementById('krwInput');
    const koreanUnitText = document.getElementById('koreanUnitText');
    const clearInputBtn = document.getElementById('clearInputBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const currencyGrid = document.getElementById('currencyGrid');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const toggleEditRateBtn = document.getElementById('toggleEditRateBtn');
    const editRateBtnText = document.getElementById('editRateBtnText');
    const customRateBanner = document.getElementById('customRateBanner');
    const restoreDefaultRatesBtn = document.getElementById('restoreDefaultRatesBtn');
    const reverseBadge = document.getElementById('reverseBadge');
    const toastNotification = document.getElementById('toastNotification');
    const toastMessage = document.getElementById('toastMessage');

    /**
     * 숫자를 천 단위 콤마 포맷으로 변환
     */
    function formatNumber(num, decimals = 0) {
      if (isNaN(num) || num === null) return '0';
      return num.toLocaleString('ko-KR', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    /**
     * 원화 금액을 한국어 읽기 단위(예: 12만 3,400원)로 변환
     */
    function formatKoreanCurrencyText(amount) {
      if (!amount || amount <= 0) return '0원';
      const eok = Math.floor(amount / 100000000);
      const man = Math.floor((amount % 100000000) / 10000);
      const rest = Math.floor(amount % 10000);

      let parts = [];
      if (eok > 0) parts.push(`${eok.toLocaleString()}억`);
      if (man > 0) parts.push(`${man.toLocaleString()}만`);
      if (rest > 0) parts.push(`${rest.toLocaleString()}`);

      return parts.join(' ') + '원';
    }

    /**
     * 토스트 메시지 표시 함수
     */
    let toastTimeout;
    function showToast(message) {
      toastMessage.textContent = message;
      toastNotification.classList.remove('hidden', 'toast-animate');
      // 리플로우 강제 발생으로 애니메이션 재시작
      void toastNotification.offsetWidth;
      toastNotification.classList.add('toast-animate');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastNotification.classList.add('hidden');
      }, 2000);
    }

    /**
     * 클립보드 텍스트 복사 (iframe 환경 호환 execCommand 사용)
     */
    function copyToClipboard(text, label) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(`${label} 복사됨! (${text})`);
      } catch (err) {
        showToast('복사에 실패했습니다.');
      }
    }

    /**
     * 통화 카드 HTML 초기 렌더링
     */
    function renderCurrencyCards() {
      currencyGrid.innerHTML = '';

      INITIAL_CURRENCIES.forEach(currency => {
        const currentRate = state.rates[currency.code];
        const card = document.createElement('div');
        
        // 일본 엔화와 미국 달러는 상단에서 은은하게 강조 스타일 적용
        const featuredStyle = currency.featured
          ? 'border-blue-200/90 dark:border-blue-900/60 bg-gradient-to-br from-white to-blue-50/30 dark:from-slate-900 dark:to-blue-950/20'
          : 'border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900';

        card.id = `card-${currency.code}`;
        card.className = `rounded-2xl p-4 sm:p-5 border shadow-sm transition-all duration-200 hover:shadow-md ${featuredStyle}`;

        card.innerHTML = `
          <!-- 카드 상단: 국기, 통화명, 복사 버튼 -->
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2.5">
              <span class="text-2xl leading-none select-none">${currency.flag}</span>
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-900 dark:text-white text-sm sm:text-base">${currency.name}</span>
                  <span class="text-xs font-semibold px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                    ${currency.code}
                  </span>
                  ${currency.featured ? `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300">주요</span>` : ''}
                </div>
              </div>
            </div>

            <!-- 원클릭 복사 버튼 -->
            <button type="button" id="copy-${currency.code}"
              class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 dark:hover:text-white transition flex items-center gap-1 active:scale-95">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <span>복사</span>
            </button>
          </div>

          <!-- 카드 중단: 환산 결과 (역산 입력 겸용 인풋) -->
          <div class="relative flex items-center my-2">
            <span class="absolute left-3.5 text-base sm:text-lg font-bold text-slate-400 dark:text-slate-500 select-none">
              ${currency.symbol}
            </span>
            <input 
              id="input-${currency.code}"
              type="text"
              inputmode="decimal"
              aria-label="${currency.name} 금액"
              class="w-full pl-11 pr-3 py-2.5 text-right text-xl sm:text-2xl font-bold font-mono tracking-tight rounded-xl bg-slate-50/90 dark:bg-slate-950/60 border border-slate-200/80 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 focus:bg-white dark:focus:bg-slate-950 transition cursor-pointer focus:cursor-text"
            />
          </div>

          <!-- 카드 하단: 기준 환율 표시 및 직접 수정 입력창 -->
          <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span>기준 환율</span>
            
            <!-- 일반 보기 모드 텍스트 -->
            <span id="rate-display-${currency.code}" class="font-medium text-slate-600 dark:text-slate-300">
              ${currency.unit} ${currency.code} = ${formatNumber(currentRate, 2)}원
            </span>

            <!-- 환율 직접 수정 모드 입력창 -->
            <div id="rate-edit-${currency.code}" class="hidden flex items-center gap-1">
              <span>${currency.unit} ${currency.code} =</span>
              <input 
                id="rate-input-${currency.code}"
                type="number" 
                step="0.01" 
                value="${currentRate}"
                class="w-24 px-2 py-1 text-right font-semibold text-blue-600 dark:text-blue-400 bg-blue-50/70 dark:bg-blue-950/50 border border-blue-300 dark:border-blue-700 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500"
              />
              <span>원</span>
            </div>
          </div>
        `;

        currencyGrid.appendChild(card);

        // 각 통화 인풋 이벤트 연결 (외화 입력 시 KRW 및 전체 통화 역산)
        const foreignInput = document.getElementById(`input-${currency.code}`);
        foreignInput.addEventListener('focus', () => {
          state.activeCurrency = currency.code;
          reverseBadge.classList.remove('hidden');
          // 포커스 시 콤마 제거하여 편집 용이하게 함
          const rawVal = foreignInput.value.replace(/,/g, '');
          if (parseFloat(rawVal) === 0) {
            foreignInput.value = '';
          } else {
            foreignInput.value = rawVal;
          }
        });

        foreignInput.addEventListener('blur', () => {
          state.activeCurrency = 'KRW';
          reverseBadge.classList.add('hidden');
          updateAllCalculations();
        });

        foreignInput.addEventListener('input', (e) => {
          // 숫자와 소수점만 허용
          let cleaned = e.target.value.replace(/[^0-9.]/g, '');
          const parts = cleaned.split('.');
          if (parts.length > 2) {
            cleaned = parts[0] + '.' + parts.slice(1).join('');
          }
          e.target.value = cleaned;

          const foreignVal = parseFloat(cleaned) || 0;
          const rate = state.rates[currency.code];
          // 외화 -> 원화 역산 공식: (외화금액 / 기준단위) * 기준환율
          state.krwAmount = (foreignVal / currency.unit) * rate;
          
          updateAllCalculations(currency.code);
        });

        // 복사 버튼 이벤트 연결
        const copyBtn = document.getElementById(`copy-${currency.code}`);
        copyBtn.addEventListener('click', () => {
          const valText = foreignInput.value || '0';
          copyToClipboard(`${currency.symbol}${valText} (${currency.code})`, currency.name);
        });

        // 환율 직접 수정 인풋 이벤트 연결
        const rateInput = document.getElementById(`rate-input-${currency.code}`);
        rateInput.addEventListener('input', (e) => {
          const newRate = parseFloat(e.target.value);
          if (!isNaN(newRate) && newRate > 0) {
            state.rates[currency.code] = newRate;
            document.getElementById(`rate-display-${currency.code}`).textContent = 
              `${currency.unit} ${currency.code} = ${formatNumber(newRate, 2)}원`;
            updateAllCalculations();
          }
        });
      });
    }

    /**
     * 전체 통화 환산 금액 일괄 업데이트
     * @param {string|null} skipCurrencyCode - 현재 사용자가 타이핑 중인 통화 코드는 덮어쓰지 않음
     */
    function updateAllCalculations(skipCurrencyCode = null) {
      // 1. KRW 입력창 업데이트 (원화 직접 입력 중이 아닐 때)
      if (skipCurrencyCode !== 'KRW') {
        const roundedKrw = Math.round(state.krwAmount);
        krwInput.value = roundedKrw > 0 ? formatNumber(roundedKrw, 0) : '';
      }

      // 한글 단위 표시 업데이트
      koreanUnitText.textContent = formatKoreanCurrencyText(Math.round(state.krwAmount));

      // 2. 각 외화 카드 업데이트
      INITIAL_CURRENCIES.forEach(currency => {
        if (skipCurrencyCode === currency.code) return;

        const foreignInput = document.getElementById(`input-${currency.code}`);
        if (!foreignInput) return;

        const rate = state.rates[currency.code];
        // 원화 -> 외화 환산 공식: (원화금액 / 기준환율) * 기준단위
        const converted = rate > 0 ? (state.krwAmount / rate) * currency.unit : 0;

        foreignInput.value = formatNumber(converted, currency.decimals);
      });
    }

    /**
     * KRW 메인 입력창 이벤트 리스너
     */
    krwInput.addEventListener('focus', () => {
      state.activeCurrency = 'KRW';
      reverseBadge.classList.add('hidden');
    });

    krwInput.addEventListener('input', (e) => {
      // 숫자만 추출
      const rawDigits = e.target.value.replace(/[^0-9]/g, '');
      const numericValue = parseInt(rawDigits, 10) || 0;
      
      // 최대 100조 원 제한 (레이아웃 보호)
      const clampedValue = Math.min(numericValue, 100000000000000);
      state.krwAmount = clampedValue;

      // 입력창에 즉시 천 단위 콤마 포맷팅 적용
      e.target.value = clampedValue > 0 ? formatNumber(clampedValue, 0) : '';

      updateAllCalculations('KRW');
    });

    /**
     * 입력 지우기 ('X') 및 초기화 버튼
     */
    function resetAmount() {
      state.krwAmount = 0;
      state.activeCurrency = 'KRW';
      reverseBadge.classList.add('hidden');
      krwInput.value = '';
      updateAllCalculations('KRW');
      krwInput.focus();
    }

    clearInputBtn.addEventListener('click', resetAmount);
    resetAllBtn.addEventListener('click', () => {
      resetAmount();
      showToast('금액이 초기화되었습니다.');
    });

    /**
     * 빠른 금액 추가 버튼 (+1천원, +1만원 등)
     */
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const addValue = parseInt(btn.getAttribute('data-add'), 10);
        state.krwAmount = Math.min((state.krwAmount || 0) + addValue, 100000000000000);
        state.activeCurrency = 'KRW';
        reverseBadge.classList.add('hidden');
        updateAllCalculations();
      });
    });

    /**
     * 환율 직접 수정 모드 토글
     */
    toggleEditRateBtn.addEventListener('click', () => {
      state.isEditRateMode = !state.isEditRateMode;

      if (state.isEditRateMode) {
        customRateBanner.classList.remove('hidden');
        toggleEditRateBtn.classList.add('border-blue-500', 'text-blue-600', 'dark:text-blue-400', 'bg-blue-50/50', 'dark:bg-blue-950/30');
        editRateBtnText.textContent = '환율 수정 완료';
      } else {
        customRateBanner.classList.add('hidden');
        toggleEditRateBtn.classList.remove('border-blue-500', 'text-blue-600', 'dark:text-blue-400', 'bg-blue-50/50', 'dark:bg-blue-950/30');
        editRateBtnText.textContent = '환율 직접 수정';
      }

      INITIAL_CURRENCIES.forEach(currency => {
        const displayEl = document.getElementById(`rate-display-${currency.code}`);
        const editEl = document.getElementById(`rate-edit-${currency.code}`);
        if (state.isEditRateMode) {
          displayEl.classList.add('hidden');
          editEl.classList.remove('hidden');
        } else {
          displayEl.classList.remove('hidden');
          editEl.classList.add('hidden');
        }
      });
    });

    /**
     * 기본 고시환율 복원 버튼
     */
    restoreDefaultRatesBtn.addEventListener('click', () => {
      INITIAL_CURRENCIES.forEach(currency => {
        state.rates[currency.code] = currency.defaultRate;
        const rateInput = document.getElementById(`rate-input-${currency.code}`);
        const rateDisplay = document.getElementById(`rate-display-${currency.code}`);
        if (rateInput) rateInput.value = currency.defaultRate;
        if (rateDisplay) {
          rateDisplay.textContent = `${currency.unit} ${currency.code} = ${formatNumber(currency.defaultRate, 2)}원`;
        }
      });
      updateAllCalculations();
      showToast('기본 고시환율로 복원되었습니다.');
    });

    /**
     * 다크 모드 / 라이트 모드 전환
     */
    function initTheme() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) {
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    });

    // 앱 초기화 실행
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderCurrencyCards();
      updateAllCalculations();
    });
  </script>
</body>
</html>
